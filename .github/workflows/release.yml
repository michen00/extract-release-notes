name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "body.md" > body.md
      - uses: ncipollo/release-action@v1
        with:
          # artifacts: "release.tar.gz,foo/*.txt"
          bodyFile: "body.md"
          generateReleaseNotes: true
